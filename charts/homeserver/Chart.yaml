apiVersion: v2
name: homeserver
description: Umbrella ("chart of charts") that installs every service running on the homeserver
type: application
version: 0.1.0
dependencies:
  # Local sample app, proves the whole chain (ingress, DNS, storage) works.
  - name: whoami
    version: 0.1.0
    repository: file://charts-local/whoami
    condition: whoami.enabled

  # Exposes services to your tailnet. Needs OAuth credentials in the gitignored
  # secrets.yaml, see docs/tailscale.md.
  - name: tailscale-operator
    version: 1.102.4
    repository: https://pkgs.tailscale.com/helmcharts
    condition: tailscale-operator.enabled

  # Examples of third-party charts. Uncomment, then run `helm dependency update`.
  # - name: cert-manager
  #   version: v1.16.2
  #   repository: https://charts.jetstack.io
  #   condition: cert-manager.enabled
