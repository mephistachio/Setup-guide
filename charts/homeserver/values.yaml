# Global values are visible to every subchart as .Values.global.*
global:
  domain: home.lan
  storageClass: local-path   # k3s default; data lands on the RAID, see docs

# One block per subchart. Each is toggled by its `enabled` flag
# (matched by `condition:` in Chart.yaml) and passes the rest to the subchart.
whoami:
  enabled: true
  ingress:
    host: whoami.home.lan

# Credentials (oauth.clientId / oauth.clientSecret) belong in secrets.yaml, not here.
tailscale-operator:
  enabled: true
  operatorConfig:
    hostname: homelab-operator

# Reachable only from the tailnet: https://jellyfin.<tailnet>.ts.net
# The hostname is the first label of ingress.tls[].hosts.
jellyfin:
  enabled: true
  persistence:
    config:
      size: 5Gi
      storageClass: local-path   # lands on /srv/data/k3s-storage
    media:
      type: hostPath
      hostPath: /srv/data/media  # created by the raid role; put your files here
  ingress:
    enabled: true
    className: tailscale
    hosts:
      - host: jellyfin
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - jellyfin
