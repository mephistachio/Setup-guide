- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    content: |
      PasswordAuthentication {{ 'no' if ssh_disable_password_auth else 'yes' }}
      PermitRootLogin no
    validate: sshd -t -f %s
  register: ssh_config

- name: Enable and reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: "{{ 'reloaded' if ssh_config is changed else 'started' }}"
