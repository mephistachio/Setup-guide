# Config goes in place before installing so volumes land on the RAID.
- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  register: k3s_config

- name: Create k3s unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"

- name: Make k3s wait for its mounts
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/wait-for-data.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor={{ k3s_required_mounts | join(' ') }}
  register: k3s_dropin

- name: Check for k3s
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/sbin/k3s-install.sh
    mode: "0755"
  when: not k3s_binary.stat.exists or k3s_upgrade

- name: Install k3s
  ansible.builtin.command: /usr/local/sbin/k3s-install.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_binary.stat.exists or k3s_upgrade
  register: k3s_install
  changed_when: true

- name: Restart k3s after config change
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
    daemon_reload: true
  when: (k3s_config is changed or k3s_dropin is changed) and k3s_install is skipped

- name: Make sure k3s is running
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true

- name: Wait for the node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Install graceful shutdown unit
  ansible.builtin.template:
    src: k3s-shutdown@.service.j2
    dest: /etc/systemd/system/k3s-shutdown@.service
    mode: "0644"
  when: k3s_graceful_shutdown
  register: k3s_shutdown_unit

- name: Enable graceful shutdown for this node
  ansible.builtin.systemd_service:
    name: k3s-shutdown@{{ k3s_node_name }}.service
    enabled: true
    state: started
    daemon_reload: "{{ k3s_shutdown_unit is changed }}"
  when: k3s_graceful_shutdown
